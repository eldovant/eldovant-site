<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="0; url=./en/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELDOVANT</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="canonical" href="https://www.eldovant.com/en/">
<link rel="alternate" hreflang="en" href="https://www.eldovant.com/en/">
<link rel="alternate" hreflang="it" href="https://www.eldovant.com/it/">
<link rel="alternate" hreflang="x-default" href="https://www.eldovant.com/en/">
<style>
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:#070605;color:#ece5d3;font:400 16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  a{color:#f1d48f}
</style>
<script>
(function(){
  try{
    var saved=null; try{ saved=localStorage.getItem('eld-lang'); }catch(e){}
    var lang=saved;
    if(!lang){
      var nav=(navigator.languages&&navigator.languages[0])||navigator.language||'en';
      lang=/^it\b/i.test(nav)?'it':'en';
      try{ localStorage.setItem('eld-lang',lang); }catch(e){}
    }
    location.replace('./'+lang+'/');
  }catch(e){ location.replace('./en/'); }
})();
</script>
</head>
<body>
<noscript><p>ELDOVANT — <a href="./en/">English</a> · <a href="./it/">Italiano</a></p></noscript>
<p>ELDOVANT — <a href="./en/">English</a> · <a href="./it/">Italiano</a></p>
</body>
</html>
